version: 2.1

orbs:
  node: circleci/node@5.6.2

jobs:
  build:
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Build
          command: npm run build
      - run:
          name: Test
          command: npm run test
      - persist_to_workspace:
          root: .
          paths:
            - dist/
            - package.json
            - package-lock.json

  deploy:
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install dependencies for deployment (if needed)
          command: npm install --production # Install production dependencies
      - run:
          name: Deploy to production (example deployment)
          command: |
            # Replace with your actual deployment commands
            echo "Deploying to production..."
            # Example using node to run dist/index.js
            # node dist/index.js # or your deployment command
            echo "Deployment complete."

workflows:
  build-and-deploy:
    jobs:
      - build:
          filters:
            branches:
              ignore: /^release-.*/
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main