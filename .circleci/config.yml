version: 2.1

jobs:
  build:
    docker:
      - image: circleci/node:20
        environment:
          MONGO_URL: mongodb://localhost:27017/testdb
    services:
      - mongodb
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: Lint Code
          command: npm run lint
      - run:
          name: Build Project
          command: npm run build
      - run:
          name: Run Tests
          command: npm run test

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
